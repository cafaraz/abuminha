about: >-
  ## ഞാൻ സി എ ഫറാസ് (അബുമിൻഹ)


  കാസർകോട് ജില്ലയിലെ മേൽപ്പറമ്പ് ആണ് എന്റെ നാട്. മേൽപ്പറമ്പ് പള്ളിക്ക് മുന്നിലുള്ള മദ്റസ കെട്ടിടത്തിൽ പ്രവർത്തിച്ചിരുന്ന എൽ.പി. സ്കൂളിലായിരുന്നു പ്രാഥമിക പഠനം; മദ്റസ പഠനവും അവിടെത്തന്നെ. പിന്നീട് മേൽപ്പറമ്പിലെ ഗവൺമെന്റ് ഹൈസ്കൂൾ ചന്ദ്രഗിരിയിലും ശേഷം കാസർകോട് ഗവൺമെന്റ് കോളേജിലുമായി പഠനം പൂർത്തിയാക്കി.


  മൂന്ന് പതിറ്റാണ്ടിലേറെയായി ദുബായിൽ പാക്കേജിംഗ് മേഖലയിലെ പ്രീപ്രസ് രംഗത്ത് പ്രവർത്തിക്കുന്നു. പ്രിന്റിങ്ങിനായി അക്ഷരങ്ങളും ചിത്രങ്ങളും ഒരുക്കുന്ന ജോലിക്കിടയിലും എഴുത്ത് എന്നും എന്റെ കൂടെയുണ്ടായിരുന്നു.


  ചെറുപ്പത്തിലേ മനസ്സിൽ തളിർത്തതാണ് ലീഗിന്റെ രാഷ്ട്രീയവും സമസ്തയുടെ ആദർശവും. അതുകൊണ്ടുതന്നെ എന്റെ എഴുത്തുകളെയും അവ പലപ്പോഴും സ്വാധീനിച്ചിട്ടുണ്ട്. അഹ്‌ലുസ്സുന്നത്തി വൽ ജമാഅത്തിന്റെ ആദർശവും ചരിത്രവും, സമകാലിക നിരീക്ഷണങ്ങളും — പലപ്പോഴായി എഴുതിയതും ഇപ്പോൾ എഴുതിക്കൊണ്ടിരിക്കുന്നതുമായ അത്തരം രചനകളാണ് ഇവിടെ കൊണ്ടുവന്ന് നിക്ഷേപിക്കുന്നത്. ചിലത് പുസ്തകങ്ങളായും ചിലത് ലേഖനങ്ങളായും ഒരുക്കിവെച്ചിട്ടുണ്ട്.


  പുതിയ എഴുത്തുകളും പുസ്തകങ്ങളും തയ്യാറാകുന്ന മുറയ്ക്ക് ഇവിടെ ചേർത്തുകൊണ്ടിരിക്കും, ഇൻശാ അല്ലാഹ്.


  നിങ്ങളുടെ അഭിപ്രായങ്ങളും നിർദ്ദേശങ്ങളും "ഫീഡ്‌ബാക്ക്" പേജ് വഴി അറിയിക്കാം.

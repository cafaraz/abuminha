about: >-
  ## ഞാൻ സി എ ഫറാസ് (അബുമിൻഹ)


  ഞാൻ സി. എ. ഫറാസ്. എന്റെ എഴുത്തുകൾ ഏറെയും അബുമിൻഹ എന്ന പേരിലായിരുന്നു. കാസർകോട് ജില്ലയിൽ ചന്ദ്രഗിരിപ്പുഴയുടെ തീരത്ത്, ചരിത്രവും പൈതൃകവും സംസ്കാരവും മതസൗഹാർദവും ഇഴചേർന്നുനിൽക്കുന്ന മേൽപ്പറമ്പാണ് എന്റെ ജന്മനാട്.


  എന്റെ ജീവിതത്തിലെ ആദ്യാക്ഷരങ്ങൾ കുറിക്കപ്പെട്ടത് മേൽപ്പറമ്പ് പള്ളിക്ക് മുന്നിലുള്ള മദ്രസ കെട്ടിടത്തിൽ പ്രവർത്തിച്ചിരുന്ന എൽ.പി. സ്കൂളിലായിരുന്നു. അതേ കെട്ടിടത്തിൽ പ്രവർത്തിച്ചിരുന്ന മേൽപ്പറമ്പ് മുനീറുൽ ഇസ്‌ലാം മദ്രസയിൽ നിന്നാണ് മതപഠനത്തിന്റെ ആദ്യപാഠങ്ങൾ സ്വായത്തമാക്കിയത്. ഒരു വശത്ത് ഭൗതികവിദ്യാഭ്യാസത്തിന്റെ ബാലപാഠങ്ങളും മറുവശത്ത് ദീനീ വിജ്ഞാനത്തിന്റെ വെളിച്ചവും പകർന്നുനൽകിയ ആ കാലമാണ് എന്റെ ജീവിതത്തിന് അടിത്തറ പാകിയത്.


  പിന്നീട് മേൽപ്പറമ്പ് പാറപ്പുറത്തെ വിശാലമായ ഗവൺമെന്റ് ഹൈസ്കൂൾ ചന്ദ്രഗിരിയിലും തുടർന്ന് കാസർകോട് ഗവൺമെന്റ് കോളേജിലുമായി പഠനം മുന്നോട്ടുകൊണ്ടുപോയി. അറിവിന്റെയും അനുഭവങ്ങളുടെയും പുതിയ ലോകങ്ങളിലേക്ക് തുറന്ന ആ വിദ്യാർത്ഥിജീവിതം എന്റെ ചിന്തകളെയും കാഴ്ചപ്പാടുകളെയും രൂപപ്പെടുത്തുന്നതിൽ വലിയ പങ്കുവഹിച്ചു.


  ജീവിതമാർഗം തേടിയുള്ള യാത്ര എന്നെ ദുബായിലെത്തിച്ചു. ഏറെക്കാലമായി പാക്കേജിംഗ് വ്യവസായത്തിലെ പ്രീപ്രസ് മേഖലയിലാണ് ഞാൻ പ്രവർത്തിച്ചുവരുന്നത്. അച്ചടിക്ക് മുമ്പായി അക്ഷരങ്ങളെയും ചിത്രങ്ങളെയും വർണങ്ങളെയും സാങ്കേതികമികവോടെ ഒരുക്കിയെടുക്കുന്ന ജോലിയാണത്. വിവിധ കമ്പനികളുടെ വ്യത്യസ്ത ഉൽപ്പന്നങ്ങൾക്ക് അവരുടെ താൽപര്യങ്ങൾക്കനുസരിച്ച് ഡിസൈനുകൾ തയ്യാറാക്കി, അവ അച്ചടിയുടെ ഭാഷയിലേക്ക് പകർത്തിയെടുക്കുന്നതാണ് എന്റെ ദൗത്യം. ആ തൊഴിൽജീവിതത്തിനിടയിലും മനസ്സിന്റെ ഉള്ളറകളിൽ സ്വന്തം അക്ഷരങ്ങൾ വളർന്നുകൊണ്ടിരുന്നു. ഉപജീവനത്തിരക്കുകൾക്കിടയിലും എഴുത്തിനോടുള്ള ആഭിമുഖ്യം ഒരിക്കലും കൈവിട്ടുപോയില്ല.


  ചെറുപ്പത്തിലേ മനസ്സിൽ വേരൂന്നിയതാണ് മുസ്‌ലിം ലീഗിന്റെ രാഷ്ട്രീയവും സമസ്തയുടെ ആദർശവും. ഈ പ്രസ്ഥാനങ്ങളുടെ ആശയലോകവും നിലപാടുകളും, അഹ്‌ലുസ്സുന്നത്തി വൽജമാഅത്തിന്റെ പാരമ്പര്യവും, പണ്ഡിതന്മാരുടെയും സാത്വികരായ ഉമറാക്കളുടെയും നേതൃത്വവും എന്റെ മതചിന്തയെയും സാമൂഹിക കാഴ്ചപ്പാടുകളെയും രൂപപ്പെടുത്തുന്നതിൽ നിർണായക പങ്കുവഹിച്ചിട്ടുണ്ട്. ഈ ആദർശബന്ധങ്ങൾ കേവലം വൈകാരികമായ അനുഭാവങ്ങളിൽ ഒതുങ്ങുന്നതല്ല. അവയുടെ ചരിത്രവും ആശയാടിത്തറയും പ്രമാണങ്ങളും പഠിക്കാനും മനസ്സിലാക്കാനും അവയെക്കുറിച്ച് എഴുതാനും എക്കാലവും താൽപര്യം പുലർത്തിയിട്ടുണ്ട്. അതോടൊപ്പം, സമകാലിക സംഭവവികാസങ്ങളെ പാരമ്പര്യ ഇസ്‌ലാമിക കാഴ്ചപ്പാടിലൂടെ വിലയിരുത്താനും സമൂഹത്തിലും സമുദായത്തിലും നടക്കുന്ന മാറ്റങ്ങളോട് ക്രിയാത്മകമായി പ്രതികരിക്കാനും ഒരളവുവരെ ഞാൻ എഴുത്തിനെ ഉപാധിയാക്കിയിട്ടുണ്ട്. എങ്കിലും ജോലിത്തിരക്കും മടിയും കാരണം, എഴുതിയതിനെക്കാൾ എത്രയോ അധികമാണ് ഇനിയും എഴുതാനുള്ളത്.


  വായന എന്നും എന്റെ കൂട്ടാണ്. വിശ്വാസവും ആദർശവും, അഹ്‌ലുസ്സുന്നത്തിന്റെ ചരിത്രവും പണ്ഡിതപാരമ്പര്യവും, ഇസ്‌ലാമിക വിജ്ഞാനത്തിന്റെ മഹത്തായ പൈതൃകം, മുസ്‌ലിം സമൂഹത്തിന്റെ സാമൂഹികവും രാഷ്ട്രീയവുമായ അനുഭവങ്ങൾ, സമകാലിക വിഷയങ്ങളിലെ നിരീക്ഷണങ്ങൾ തുടങ്ങിയ മേഖലകളിലാണ് എന്റെ വായന പ്രധാനമായും സഞ്ചരിക്കുന്നത്. എന്റെ എഴുത്തുകളുടെയും വിഷയം ഏറെയും ഇവതന്നെയാണ്.


  എഴുത്ത് എനിക്ക് കേവലം ഒരു വിനോദമോ നേരംപോക്കോ അല്ല. പഠിച്ചറിഞ്ഞ കാര്യങ്ങൾ പങ്കുവെക്കാനും ചരിത്രത്തിന്റെ ഓർമ്മകൾ രേഖപ്പെടുത്താനും തെറ്റിദ്ധാരണകൾക്ക് മറുപടി നൽകാനും നിലപാടുകൾ വ്യക്തമാക്കാനും ആശയങ്ങളെ സംവാദത്തിന്റെ വെളിച്ചത്തിൽ അവതരിപ്പിക്കാനുമുള്ള ഒരു മാധ്യമമാണത്. ഒരു വിഷയത്തെക്കുറിച്ച് എഴുതുമ്പോൾ അതിന്റെ ചരിത്രവും പശ്ചാത്തലവും പ്രമാണങ്ങളും പരമാവധി പരിശോധിക്കണമെന്ന ബോധ്യമുണ്ട്. വായനയിലൂടെയും പഠനത്തിലൂടെയും തിരുത്തലുകളിലൂടെയും എഴുത്തിനെ കൂടുതൽ മെച്ചപ്പെടുത്തണമെന്ന ആഗ്രഹവും അതോടൊപ്പമുണ്ട്.


  ഇവിടെ പ്രസിദ്ധീകരിക്കുന്ന രചനകളിൽ ചിലത് ലേഖനങ്ങളാണ്. ചിലത് പുസ്തകരൂപത്തിൽ വിവിധ അധ്യായങ്ങളായി ചിട്ടപ്പെടുത്തിയ പഠനങ്ങളും നിരീക്ഷണങ്ങളുമാണ്. ചിലത് നേരത്തേ എഴുതിയവയും മറ്റു ചിലത് എഴുതിക്കൊണ്ടിരിക്കുന്നവയുമാണ്. കാലത്തിന്റെ ഒഴുക്കിൽ മറഞ്ഞുപോകാതെ, ചിന്തകളും പഠനങ്ങളും രേഖപ്പെടുത്തിവെക്കുക എന്ന ഉദ്ദേശ്യത്തോടെയാണ് അവയെല്ലാം ഈ വേദിയിൽ ഒരുമിച്ചുചേർക്കുന്നത്.


  അക്ഷരങ്ങൾ ചിലപ്പോൾ അറിവിന്റെ വെളിച്ചമാകണം; ചിലപ്പോൾ ചരിത്രത്തിന്റെ ഓർമ്മപ്പെടുത്തലും, മറ്റു ചിലപ്പോൾ നിലപാടുകളുടെ സാക്ഷ്യവുമാകണം. എന്റെ എഴുത്തുകൾക്ക് അത്തരമൊരു ദൗത്യം നിർവഹിക്കാനായാൽ അതിൽപരം സന്തോഷം മറ്റൊന്നില്ല.


  ഇത് എന്റെ രചനകളുടെ ഒരു ശേഖരം മാത്രമല്ല; കാലാകാലങ്ങളിൽ ഞാൻ വായിച്ചും ചിന്തിച്ചും അനുഭവിച്ചും രൂപപ്പെടുത്തിയെടുത്ത ആശയങ്ങളുടെ ഒരു ചെറിയ അടയാളപ്പെടുത്തൽ കൂടിയാണ്. അപൂർണതകൾ ഉണ്ടാകാം; അഭിപ്രായവ്യത്യാസങ്ങൾ സ്വാഭാവികവുമാണ്. അവയെ തുറന്ന മനസ്സോടെ സമീപിച്ച്, സത്യാന്വേഷണത്തിനും വിജ്ഞാനവിനിമയത്തിനുമുള്ള വേദിയായി ഇതിനെ മാറ്റാനാകണമെന്നാണ് ആഗ്രഹം.


  പുതിയ ലേഖനങ്ങളും പുസ്തകങ്ങളും തയ്യാറാകുന്ന മുറയ്ക്ക് ഈ ശേഖരത്തിലേക്ക് ചേർത്തുകൊണ്ടിരിക്കും, ഇൻഷാ അല്ലാഹ്.


  വായിക്കുക, വിലയിരുത്തുക, വിമർശിക്കുക, തിരുത്തലുകൾ നിർദേശിക്കുക. നിങ്ങളുടെ വിലപ്പെട്ട അഭിപ്രായങ്ങളും നിർദേശങ്ങളും ഈ സൈറ്റിലെ 'ഫീഡ്‌ബാക്ക്' പേജ് വഴി അറിയിക്കുമല്ലോ.


  നന്മയുള്ള ചിന്തകൾക്കും അറിവിന്റെ പങ്കുവെക്കലിനും ഈ അക്ഷരങ്ങൾ ഒരു ചെറിയ നിമിത്തമാകട്ടെ...


  **സി. എ. ഫറാസ് (അബുമിൻഹ)**

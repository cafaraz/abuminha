  ## ഞാൻ, സി.എ. ഫറാസ് (അബുമിൻഹ)

  കാസർകോട് ജില്ലയിലെ മേൽപ്പറമ്പ് ആണ് എന്റെ നാട്. മേൽപ്പറമ്പ് പള്ളിക്ക് മുന്നിലുള്ള മദ്റസ കെട്ടിടത്തിലെ എൽ.പി. സ്കൂളിലായിരുന്നു എന്റെ പ്രാഥമിക പഠനം. "അബുമിൻഹ" — മൂത്ത മകൾ മിൻഹയുടെ പിതാവ് — എന്ന പേരിലാണ് ഞാൻ എഴുതുന്നത്.

  ഇപ്പോൾ ദുബായിൽ. 1993 മുതൽ, മൂന്ന് പതിറ്റാണ്ടിലേറെയായി അച്ചടി-പാക്കേജിംഗ് മേഖലയിലെ പ്രീപ്രസ് രംഗത്ത് പ്രവർത്തിക്കുന്നു. അക്ഷരങ്ങളും ചിത്രങ്ങളും അച്ചടിക്ക് ഒരുക്കുന്ന ആ ജോലിക്കിടയിലും എഴുത്ത് എന്നും കൂടെയുണ്ടായിരുന്നു.

  ### എന്റെ എഴുത്തുകൾ

  ഇസ്‌ലാമിക വിശ്വാസവും ജീവിതവും, അഹ്‌ലുസ്സുന്നത്തി വൽ ജമാഅത്തിന്റെ ആദർശവും ചരിത്രവും, സമകാലിക-രാഷ്ട്രീയ നിരീക്ഷണങ്ങൾ, കുടുംബ ചരിത്രം, ഗുണപാഠ കഥകൾ — ഇങ്ങനെ പലപ്പോഴായി എഴുതിയവയാണ് ഇവിടെ. ചിലത് പുസ്തകങ്ങളായും ചിലത് ലേഖനങ്ങളായും. എന്റെ മക്കളുടെ രചനകൾക്കായി "കിഡ്സ് കോർണർ" എന്ന ഒരിടവും ഇവിടെയുണ്ട്.

  ### ഈ എഴുത്തുപുര

  ഈ രചനകളെല്ലാം ഒരിടത്ത്, ആർക്കും സൗജന്യമായി വായിക്കാൻ — അതാണ് ഈ സൈറ്റിന്റെ ലക്ഷ്യം. പുതിയ എഴുത്തുകളും പുസ്തകങ്ങളുടെ പുതിയ അധ്യായങ്ങളും തയ്യാറാകുന്ന മുറക്ക് ഇവിടെ ചേർത്തുകൊണ്ടിരിക്കും, ഇൻശാ അല്ലാഹ്.

  നിങ്ങളുടെ അഭിപ്രായങ്ങളും നിർദ്ദേശങ്ങളും "ഫീഡ്ബാക്ക്" പേജ് വഴി അറിയിക്കാം.

title: "സാമ്പിൾ പുസ്തകം: അധ്യായ റിലീസ് മാതൃക"
desc: "Word പുസ്തകങ്ങൾ അധ്യായങ്ങളായി ഒന്നൊന്നായി റിലീസ് ചെയ്യുന്നതിന്റെ മാതൃക."
publish: true
chapters:
  - title: "ആമുഖം"
    publish: true
    body: |
      ഈ പുസ്തകം ഒരു യാത്രയാണ്. ഓരോ അധ്യായവും പ്രൂഫ് റീഡിങ് കഴിയുന്ന മുറക്ക് ഇവിടെ പ്രസിദ്ധീകരിക്കും.

      > അറിവ് പങ്കുവെക്കുമ്പോഴാണ് അത് വളരുന്നത്.
  - title: "അധ്യായം 1"
    publish: true
    body: |
      ഇത് പ്രസിദ്ധീകരിച്ച ഒരു അധ്യായമാണ്. അഡ്മിൻ പാനലിൽ ഇതിലെ എഴുത്ത് എപ്പോൾ വേണമെങ്കിലും തിരുത്താം.
  - title: "അധ്യായം 2"
    publish: true
    release_date: "2026-12-01"
    body: |
      ഈ അധ്യായം 2026 ഡിസംബർ 1-ന് സ്വയം പ്രസിദ്ധീകരിക്കപ്പെടും.
  - title: "അധ്യായം 3"
    publish: false
    body: |
      ഈ അധ്യായം ഇപ്പോഴും പ്രൂഫ് റീഡിങ്ങിലാണ് (ഡ്രാഫ്റ്റ്).

# റിലീസ് തീയതി എത്തിയ അധ്യായങ്ങൾ സൈറ്റിൽ വരാൻ ദിവസവും ഒരു തവണ സൈറ്റ് പുതുക്കുന്നു.
# Cloudflare Pages-ലെ Deploy hook URL, GitHub-ൽ DEPLOY_HOOK എന്ന secret ആയി സൂക്ഷിക്കണം.
name: Daily rebuild
on:
  schedule:
    - cron: "5 20 * * *"   # ദുബായ് സമയം രാത്രി 12:05
  workflow_dispatch:
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger site rebuild
        env:
          HOOK: ${{ secrets.DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "DEPLOY_HOOK secret ഇല്ല"; exit 0; fi
          curl -fsS -X POST -d '{}' "$HOOK"

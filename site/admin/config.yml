backend:
  name: github
  repo: cafaraz/abuminha
  branch: main
  base_url: https://abuminha.pages.dev
  auth_endpoint: api/auth
  commit_messages:
    create: "പുതിയത്: {{slug}}"
    update: "തിരുത്ത്: {{slug}}"
    delete: "നീക്കം: {{slug}}"
    uploadMedia: "ഫയൽ: {{path}}"
    deleteMedia: "ഫയൽ നീക്കം: {{path}}"

site_url: https://abuminha.pages.dev
display_url: https://abuminha.pages.dev
media_folder: uploads
public_folder: /uploads

collections:
  - name: articles
    label: "ലേഖനങ്ങൾ"
    label_singular: "ലേഖനം"
    folder: content/articles
    create: true
    extension: md
    format: frontmatter
    slug: "{{year}}{{month}}{{day}}{{hour}}{{minute}}{{second}}"
    summary: "{{title}}{{title_en}}  ·  {{category}}  ·  {{lang}}  ·  പ്രസിദ്ധീകരിച്ചോ: {{publish}}"
    sortable_fields: ["title", "release_date"]
    fields:
      - {label: "തലക്കെട്ട് (മലയാളം)", name: title, widget: string, required: false, hint: "ഇംഗ്ലീഷ് മാത്രമുള്ള രചനയ്ക്ക് ഒഴിച്ചിടാം."}
      - label: "ഭാഷ"
        name: lang
        widget: select
        default: ml
        options:
          - {label: "മലയാളം മാത്രം", value: ml}
          - {label: "മലയാളം + ഇംഗ്ലീഷ്", value: both}
          - {label: "ഇംഗ്ലീഷ് മാത്രം", value: en}
        hint: "മലയാളം + ഇംഗ്ലീഷ് / ഇംഗ്ലീഷ് മാത്രം ആണെങ്കിൽ താഴെയുള്ള English ഫീൽഡുകൾ പൂരിപ്പിക്കുക."
      - {label: "മറ്റേ ഭാഷാ വിഭാഗത്തിലും കാണിക്കുക", name: both_sections, widget: boolean, default: false, required: false, hint: "ഓൺ ആക്കിയാൽ: മലയാളം രചന English വിഭാഗത്തിലും, English രചന മലയാളം വിഭാഗത്തിലും കാണും. ഓഫ് ആണെങ്കിൽ സ്വന്തം ഭാഷയുടെ വിഭാഗത്തിൽ മാത്രം. (മലയാളം + ഇംഗ്ലീഷ് ലേഖനങ്ങൾ എപ്പോഴും രണ്ടിലും വരും.)"}
      - label: "പ്രധാന വിഭാഗം"
        name: category
        widget: select
        options:
          - {label: "ഇസ്ലാം", value: islam}
          - {label: "ആദർശം", value: aadarsham}
          - {label: "രാഷ്ട്രീയം", value: politics}
          - {label: "സമകാലികം", value: current}
          - {label: "മൈ ഫാമിലി", value: family}
          - {label: "അക്ഷരമുറ്റം (മറ്റുള്ളവരുടെ രചനകൾ)", value: kids}
          - {label: "വചനാമൃതം", value: vachanam}
      - label: "ഈ ടാബുകളിലും കാണിക്കുക (വേണമെങ്കിൽ)"
        name: also
        widget: select
        multiple: true
        required: false
        hint: "ഈ ലേഖനം മറ്റു ടാബുകളിലും വരണമെങ്കിൽ ഇവിടെ തിരഞ്ഞെടുക്കുക (ഒന്നിലധികം ആകാം). നിറവും അടയാളവും പ്രധാന വിഭാഗത്തിന്റേതായിരിക്കും."
        options:
          - {label: "ഇസ്ലാം", value: islam}
          - {label: "ആദർശം", value: aadarsham}
          - {label: "രാഷ്ട്രീയം", value: politics}
          - {label: "സമകാലികം", value: current}
          - {label: "മൈ ഫാമിലി", value: family}
          - {label: "അക്ഷരമുറ്റം (മറ്റുള്ളവരുടെ രചനകൾ)", value: kids}
          - {label: "വചനാമൃതം", value: vachanam}
      - label: "ഉപവിഭാഗം (ആദർശം മാത്രം)"
        name: sub
        widget: select
        required: false
        options: ["സുന്നി ആദർശം", "ചരിത്രം"]
      - {label: "എഴുതിയത്", name: author, widget: string, required: false, hint: "മറ്റൊരാളുടെ രചനയാണെങ്കിൽ മാത്രം (ഉദാ: അക്ഷരമുറ്റം). നിങ്ങളുടേതാണെങ്കിൽ ഒഴിച്ചിടുക."}
      - {label: "ക്ലാസ് / വയസ്സ് / സ്ഥലം", name: author_info, widget: string, required: false, hint: "ഉദാ: 4-ാം ക്ലാസ്, അല്ലെങ്കിൽ ദുബായ്. വേണമെങ്കിൽ മാത്രം."}
      - {label: "എഴുതിയ തീയതി (പഴയ ലേഖനങ്ങൾക്ക് മാത്രം)", name: written, widget: string, required: false, pattern: ['^\s*\d{4}(-\d{1,2}(-\d{1,2})?)?\s*$', "2015, 2015-08, 2015-08-12 എന്നിങ്ങനെ എഴുതുക"], hint: "അറിയുന്നത്ര മാത്രം: വർഷം (2015), വർഷവും മാസവും (2015-08), അല്ലെങ്കിൽ മുഴുവൻ (2015-08-12). പുതിയ ലേഖനമാണെങ്കിൽ ഒഴിച്ചിടുക."}
      - {label: "എഴുതിയ സന്ദർഭം", name: context, widget: string, required: false, hint: "വേണമെങ്കിൽ മാത്രം. ഉദാ: 2018 പ്രളയകാലത്ത് എഴുതിയത്."}
      - {label: "ചെറിയ വിവരണം", name: desc, widget: text, required: false}
      - {label: "ലേഖന ചിത്രം (വേണമെങ്കിൽ)", name: image, widget: image, required: false, hint: "തലക്കെട്ടിന് താഴെയും കാർഡിലും കാണും. ഏത് വലുപ്പത്തിലുള്ള ഫോട്ടോയും ചേർക്കാം — സൈറ്റ് തനിയെ ചെറുതാക്കും. വീതി കൂടിയ (landscape) ചിത്രങ്ങളാണ് നല്ലത്."}
      - {label: "ചിത്രത്തിന്റെ അടിക്കുറിപ്പ് (വേണമെങ്കിൽ)", name: image_caption, widget: string, required: false}
      - {label: "പ്രസിദ്ധീകരിക്കുക", name: publish, widget: boolean, default: false, hint: "ഓഫ് ആണെങ്കിൽ വായനക്കാർക്ക് കാണില്ല (ഡ്രാഫ്റ്റ്)."}
      - {label: "റിലീസ് തീയതി", name: release_date, widget: datetime, required: false, format: "YYYY-MM-DD", date_format: "DD-MM-YYYY", time_format: false, hint: "ഒഴിച്ചിട്ടാൽ ഉടനെ. ഭാവി തീയതി കൊടുത്താൽ ആ ദിവസം സ്വയം വരും."}
      - {label: "ഉള്ളടക്കം (മലയാളം)", name: body, widget: markdown, required: false}
      - {label: "English title", name: title_en, widget: string, required: false}
      - {label: "English short description", name: desc_en, widget: text, required: false}
      - {label: "English content", name: body_en, widget: markdown, required: false}

  - name: books
    label: "പുസ്തകങ്ങൾ (അധ്യായങ്ങളായി)"
    label_singular: "പുസ്തകം"
    folder: content/books
    create: true
    extension: yml
    format: yml
    slug: "{{year}}{{month}}{{day}}{{hour}}{{minute}}{{second}}"
    summary: "{{title}}"
    fields:
      - {label: "പുസ്തകത്തിന്റെ പേര്", name: title, widget: string}
      - {label: "ചെറിയ വിവരണം", name: desc, widget: text, required: false}
      - label: "ഭാഷ"
        name: lang
        widget: select
        default: ml
        options:
          - {label: "മലയാളം", value: ml}
          - {label: "ഇംഗ്ലീഷ്", value: en}
      - {label: "മറ്റേ ഭാഷാ വിഭാഗത്തിലും കാണിക്കുക", name: both_sections, widget: boolean, default: false, required: false, hint: "ഓൺ ആക്കിയാൽ: മലയാളം രചന English വിഭാഗത്തിലും, English രചന മലയാളം വിഭാഗത്തിലും കാണും. ഓഫ് ആണെങ്കിൽ സ്വന്തം ഭാഷയുടെ വിഭാഗത്തിൽ മാത്രം."}
      - {label: "പുസ്തകം പ്രസിദ്ധീകരിക്കുക", name: publish, widget: boolean, default: false, hint: "ഓഫ് ആണെങ്കിൽ പുസ്തകം മുഴുവനായി മറഞ്ഞിരിക്കും."}
      - label: "അധ്യായങ്ങൾ"
        name: chapters
        widget: list
        summary: "{{fields.title}}  ·  പ്രസിദ്ധീകരിച്ചോ: {{fields.publish}}  {{fields.release_date}}"
        collapsed: true
        fields:
          - {label: "അധ്യായത്തിന്റെ പേര്", name: title, widget: string}
          - {label: "പ്രസിദ്ധീകരിക്കുക", name: publish, widget: boolean, default: false, hint: "പ്രൂഫ് റീഡിങ് കഴിഞ്ഞാൽ ഓൺ ആക്കുക."}
          - {label: "റിലീസ് തീയതി", name: release_date, widget: datetime, required: false, format: "YYYY-MM-DD", date_format: "DD-MM-YYYY", time_format: false, hint: "ഒഴിച്ചിട്ടാൽ ഉടനെ."}
          - {label: "ഉള്ളടക്കം", name: body, widget: markdown}

  - name: flipbooks
    label: "ചിത്ര പുസ്തകങ്ങൾ (PDF ഫ്ലിപ്പ് ബുക്ക്)"
    label_singular: "ചിത്ര പുസ്തകം"
    folder: content/flipbooks
    create: true
    extension: yml
    format: yml
    slug: "{{year}}{{month}}{{day}}{{hour}}{{minute}}{{second}}"
    summary: "{{title}}  ·  {{pages}} പേജുകൾ റിലീസ് ചെയ്തു"
    fields:
      - {label: "പുസ്തകത്തിന്റെ പേര്", name: title, widget: string}
      - {label: "ചെറിയ വിവരണം", name: desc, widget: text, required: false}
      - {label: "പ്രസിദ്ധീകരിക്കുക", name: publish, widget: boolean, default: false}
      - label: "ഭാഷ"
        name: lang
        widget: select
        default: ml
        options:
          - {label: "മലയാളം", value: ml}
          - {label: "ഇംഗ്ലീഷ്", value: en}
      - {label: "മറ്റേ ഭാഷാ വിഭാഗത്തിലും കാണിക്കുക", name: both_sections, widget: boolean, default: false, required: false, hint: "ഓൺ ആക്കിയാൽ: മലയാളം രചന English വിഭാഗത്തിലും, English രചന മലയാളം വിഭാഗത്തിലും കാണും. ഓഫ് ആണെങ്കിൽ സ്വന്തം ഭാഷയുടെ വിഭാഗത്തിൽ മാത്രം."}
      - {label: "PDF ഫയൽ", name: pdf, widget: file, hint: "PDF സൈറ്റിൽ പരസ്യമാകില്ല. അനുവദിച്ച പേജുകൾ മാത്രം ചിത്രങ്ങളായി കാണിക്കും."}
      - {label: "എത്ര പേജുകൾ വരെ റിലീസ് ചെയ്യാം", name: pages, widget: number, value_type: int, min: 1, default: 1, hint: "ഉദാ: 45 എന്ന് കൊടുത്താൽ 1 മുതൽ 45 വരെ പേജുകൾ മാത്രം കാണിക്കും."}
      - {label: "പുസ്തകം പൂർത്തിയാകുമ്പോൾ ആകെ പേജുകൾ", name: final_pages, widget: string, required: false, hint: "ഉദാ: 120 അല്ലെങ്കിൽ 100+. സൈറ്റിൽ '60 / 100+ പേജുകൾ' എന്ന് കാണിക്കും. ഒഴിച്ചിട്ടാൽ PDF-ലെ പേജുകളുടെ എണ്ണം. പുസ്തകം മുഴുവൻ റിലീസ് ചെയ്യുമ്പോൾ ഇവിടെയും മുകളിലും ഒരേ നമ്പർ കൊടുത്താൽ 'തുടരും' പേജ് മാറും."}
      - {label: "ബാക്കി പേജുകളെക്കുറിച്ചുള്ള കുറിപ്പ്", name: note, widget: string, required: false, default: "ബാക്കി പേജുകൾ ഉടൻ വരുന്നു, ഇൻശാ അല്ലാഹ്."}

  - name: settings
    label: "സൈറ്റ് ക്രമീകരണങ്ങൾ"
    editor: {preview: false}
    files:
      - name: site
        label: "ലോഗോ, ചിത്രങ്ങൾ, പോപ്പുലർ, ലിങ്കുകൾ, എബൗട്ട് മി"
        file: content/settings.yml
        fields:
          - {label: "സൈറ്റിന്റെ പേര്", name: site_name, widget: string}
          - {label: "ഉപശീർഷകം", name: tagline, widget: string}
          - {label: "ലോഗോ (മുകളിൽ)", name: logo, widget: image, required: false, hint: "പശ്ചാത്തലമില്ലാത്ത PNG, കുറഞ്ഞത് 500×500 px. ഒഴിച്ചിട്ടാൽ താൽക്കാലിക ലോഗോ."}
          - {label: "ലോഗോ (ഫൂട്ടർ, കടും നീല പശ്ചാത്തലത്തിൽ)", name: logo_footer, widget: image, required: false, hint: "ഒഴിച്ചിട്ടാൽ മുകളിലെ ലോഗോ തന്നെ."}
          - {label: "തലക്കെട്ട് — ഒന്നാം വരി", name: hero_line1, widget: string}
          - {label: "തലക്കെട്ട് — രണ്ടാം വരി (മറൂൺ നിറം)", name: hero_line2, widget: string}
          - {label: "തലക്കെട്ടിന് താഴെയുള്ള വിവരണം", name: hero_text, widget: text}
          - {label: "ബട്ടണിലെ എഴുത്ത്", name: hero_button, widget: string}
          - {label: "English — heading line 1", name: hero_line1_en, widget: string, required: false}
          - {label: "English — heading line 2 (maroon)", name: hero_line2_en, widget: string, required: false}
          - {label: "English — text under heading", name: hero_text_en, widget: text, required: false}
          - {label: "English — button text", name: hero_button_en, widget: string, required: false}
          - {label: "മുകളിലെ വലിയ ചിത്രം", name: hero_image, widget: image, required: false, hint: "ഏകദേശം 1600×1000 px. ഇടതുവശം ഇളം നിറമാകുന്നത് നല്ലത്."}
          - label: "പോപ്പുലർ ആർട്ടിക്കിൾസ് (പരമാവധി 6)"
            name: popular
            widget: relation
            collection: articles
            search_fields: ["title"]
            value_field: "{{slug}}"
            display_fields: ["title"]
            multiple: true
            max: 6
            required: false
            hint: "ഇവിടെ തിരഞ്ഞെടുക്കുന്നവ ഹോം പേജിൽ സ്ലൈഡ് ഷോ ആയി വരും. പുതിയത് ചേർക്കാൻ 6 ആയാൽ ഒന്ന് ഒഴിവാക്കുക."
          - {label: "Facebook ലിങ്ക്", name: facebook, widget: string, required: false}
          - {label: "YouTube ലിങ്ക്", name: youtube, widget: string, required: false}
          - {label: "LinkedIn ലിങ്ക്", name: linkedin, widget: string, required: false}
          - {label: "Instagram ലിങ്ക്", name: instagram, widget: string, required: false}
          - {label: "WhatsApp നമ്പർ", name: whatsapp, widget: string, required: false, hint: "രാജ്യ കോഡ് സഹിതം, + ഇല്ലാതെ. ഉദാ: 971501234567"}
          - {label: "ഇമെയിൽ (Contact, Feedback എന്നിവയ്ക്ക്)", name: email, widget: string, required: false, hint: "ഫീഡ്ബാക്ക് ഫോമിൽ എഴുതുന്നവ ഈ ഇമെയിലിൽ എത്തും."}
